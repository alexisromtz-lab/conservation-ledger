name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -o addopts="" -q
      - name: The published table must equal the recomputed one
        run: python -m pytest -o addopts="" -q tests/test_readme.py
      - name: CLI re-derives the act code from receipts, not from declarations
        run: |
          set +e
          conservation-ledger verify receipts/*.json
          rc=$?
          echo "rc=$rc"
          test "$rc" = "1"
